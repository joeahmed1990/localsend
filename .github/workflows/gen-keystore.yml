name: Generate keystore
on: workflow_dispatch

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore my-release-key.jks \
            -alias mykey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LocalSend Mod, O=Dev, C=EG" \
            -storepass "$PASS" -keypass "$PASS"
          base64 -w 0 my-release-key.jks > keystore_base64.txt
          printf "KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=mykey\n" "$PASS" "$PASS" > info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            keystore_base64.txt
            info.txt
            my-release-key.jks
          retention-days: 1
